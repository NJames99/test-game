<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number Guess</title>
<style>
:root{
  --bg:#e9eef3; --tile:#ffffff; --tile-line:#c9d3de; --ink:#101c2b; --muted:#5d6b7c;
  --accent:#0b7a75; --accent-fg:#ffffff; --gone:#dbe3eb;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621; --tile:#172334; --tile-line:#2a3b52; --ink:#e8eef5; --muted:#93a3b7;
    --accent:#3fd0c4; --accent-fg:#06201e; --gone:#121c29; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621; --tile:#172334; --tile-line:#2a3b52; --ink:#e8eef5; --muted:#93a3b7;
  --accent:#3fd0c4; --accent-fg:#06201e; --gone:#121c29; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; justify-content:center; padding:24px 16px;
}
main{width:100%; max-width:520px}
h1{font-size:1.1rem; font-weight:600; margin:0 0 20px; color:var(--muted)}
#msg{
  font-size:1.9rem; font-weight:700; line-height:1.2; margin:0; min-height:5.2rem;
  padding:14px 16px; border-radius:12px; display:flex; align-items:center;
}
#msg.low,#msg.high{color:#fff; font-size:2.2rem}
#msg.low{background:#1d4ed8}
#msg.high{background:#c2410c}
#msg.won{background:var(--accent); color:var(--accent-fg)}
#msg.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#msg.pop{animation:none}}
#range{min-height:1.5em; margin:8px 0 20px; color:var(--muted); font-size:1rem; font-variant-numeric:tabular-nums}
#grid{display:grid; grid-template-columns:repeat(10,1fr); gap:6px}
#grid button{
  aspect-ratio:1; padding:0; border-radius:8px; border:1px solid var(--tile-line);
  background:var(--tile); color:var(--ink); font:inherit; font-size:.85rem; font-weight:600;
  font-variant-numeric:tabular-nums; cursor:pointer; transition:transform .08s, border-color .08s;
}
#grid button:hover:not(:disabled){border-color:var(--accent); transform:translateY(-2px)}
#grid button:focus-visible,#again:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
#grid button:disabled{cursor:default; background:var(--gone); border-color:transparent; color:var(--muted); text-decoration:line-through}
#grid button.win{background:var(--accent); color:var(--accent-fg); border-color:var(--accent); text-decoration:none; transform:scale(1.12)}
#again{
  margin-top:20px; padding:10px 18px; border-radius:999px; border:0; cursor:pointer;
  background:var(--ink); color:var(--bg); font:inherit; font-weight:600;
}
#again[hidden]{display:none}
@media (max-width:420px){#grid{gap:4px} #grid button{font-size:.72rem; border-radius:6px} #msg,#msg.low,#msg.high{font-size:1.6rem}}
</style>
</head>
<body>
<main>
  <h1>Number Guess</h1>
  <p id="msg" aria-live="polite"></p>
  <p id="range"></p>
  <div id="grid"></div>
  <button id="again" type="button" hidden>Play again</button>
</main>
<script>
(function(){
  var MAX = 50, DELAY = 3000, secret, lo, hi, guesses, over, timers = [];
  var grid = document.getElementById("grid"),
      msg = document.getElementById("msg"),
      range = document.getElementById("range"),
      again = document.getElementById("again"),
      tiles = [];

  for (var n = 1; n <= MAX; n++) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = n; b.dataset.n = n;
    grid.appendChild(b); tiles.push(b);
  }

  function setMsg(text, cls) {
    msg.className = "";
    void msg.offsetWidth;
    if (cls) msg.className = cls + " pop";
    msg.textContent = text;
  }

  function retire(from, to) {
    var batch = [];
    for (var i = from; i <= to; i++) {
      var t = tiles[i - 1];
      if (!t.disabled) batch.push(t);
    }
    timers.push(setTimeout(function(){
      batch.forEach(function(t){ if (!over) t.disabled = true; });
    }, DELAY));
  }

  function start() {
    secret = 1 + Math.floor(Math.random() * MAX);
    lo = 1; hi = MAX; guesses = 0; over = false;
    timers.forEach(clearTimeout); timers = [];
    tiles.forEach(function(t){ t.disabled = false; t.className = ""; });
    setMsg("Pick a number from 1 to " + MAX + ".", "");
    range.textContent = "Between 1 and " + MAX;
    again.hidden = true;
  }

  function guess(g) {
    if (over) return;
    guesses++;
    if (g === secret) {
      over = true;
      timers.forEach(clearTimeout); timers = [];
      tiles.forEach(function(t){ t.disabled = true; });
      tiles[g - 1].classList.add("win");
      setMsg("You got it in " + guesses + (guesses === 1 ? " guess" : " guesses") + ", the number was " + g + "!", "won");
      range.textContent = "";
      again.hidden = false; again.focus();
      return;
    }
    if (g < secret) {
      lo = Math.max(lo, g + 1);
      setMsg("▲ " + g + " is too low, so guess higher.", "low");
      retire(1, g);
    } else {
      hi = Math.min(hi, g - 1);
      setMsg("▼ " + g + " is too high, so guess lower.", "high");
      retire(g, MAX);
    }
    range.textContent = "Between " + lo + " and " + hi + " · " + guesses + (guesses === 1 ? " guess" : " guesses") + " so far";
  }

  grid.addEventListener("click", function(e){
    var t = e.target.closest("button");
    if (t && !t.disabled) guess(+t.dataset.n);
  });
  again.addEventListener("click", start);
  start();
})();
</script>
</body>
</html>
